    <script>
        // --- 23 EXERCISES DEFINITIONS & SOLVERS ---
        const exercises = [
            {
                id: 1,
                category: "Normal",
                title: "1. Dist. Normal - Tiempo de ejecución de script RStudio",
                statement: "El tiempo de compilación y ejecución de un modelo de análisis multivariado mediante un script de RStudio sigue una distribución normal con media $\\mu=45$ segundos y desviación estándar $\\sigma=6$ segundos. a) Calcule $P(X < 40)$. b) Calcule $P(X > 60)$.",
                params: [
                    { id: "mu", label: "Media (μ)", min: 10, max: 100, step: 1, val: 45 },
                    { id: "sigma", label: "Desviación Estándar (σ)", min: 1, max: 20, step: 0.5, val: 6 },
                    { id: "x1", label: "Umbral Parte a (X < x)", min: 20, max: 60, step: 1, val: 40 },
                    { id: "x2", label: "Umbral Parte b (X > x)", min: 40, max: 80, step: 1, val: 60 }
                ],
                solve: (p) => {
                    const z1 = (p.x1 - p.mu) / p.sigma;
                    const probA = jStat.normal.cdf(p.x1, p.mu, p.sigma);
                    const z2 = (p.x2 - p.mu) / p.sigma;
                    const probB = 1 - jStat.normal.cdf(p.x2, p.mu, p.sigma);

                    return {
                        metrics: [
                            { label: "P(X < " + p.x1 + ")", value: (probA * 100).toFixed(2) + "%", delta: `Z = ${z1.toFixed(2)}` },
                            { label: "P(X > " + p.x2 + ")", value: (probB * 100).toFixed(4) + "%", delta: `Z = ${z2.toFixed(2)}` },
                            { label: "Media (μ)", value: `${p.mu} s` },
                            { label: "Desv. Est. (σ)", value: `${p.sigma} s` }
                        ],
                        math: `
                        <p><b>Definición:</b> La variable aleatoria $X$ representa el tiempo de ejecución en segundos, con $X \\sim N(\\mu = ${p.mu}, \\sigma^2 = ${p.sigma}^2)$.</p>
                        
                        <p><b>Parte a)</b> Probabilidad de terminar en menos de ${p.x1} segundos, $P(X < ${p.x1})$:</p>
                        $$Z_1 = \\frac{X - \\mu}{\\sigma} = \\frac{${p.x1} - ${p.mu}}{${p.sigma}} = ${z1.toFixed(4)}$$
                        $$P(X < ${p.x1}) = P(Z < ${z1.toFixed(4)}) = \\mathbf{${probA.toFixed(4)}} \\quad (${(probA*100).toFixed(2)}\\%)$$

                        <p><b>Parte b)</b> Probabilidad de tardar más de ${p.x2} segundos (1 minuto), $P(X > ${p.x2})$:</p>
                        $$Z_2 = \\frac{${p.x2} - ${p.mu}}{${p.sigma}} = ${z2.toFixed(4)}$$
                        $$P(X > ${p.x2}) = 1 - P(Z \\le ${z2.toFixed(4)}) = 1 - ${jStat.normal.cdf(p.x2, p.mu, p.sigma).toFixed(6)} = \\mathbf{${probB.toFixed(6)}} \\quad (${(probB*100).toFixed(4)}\\%)$$
                        `,
                        chart: { type: 'normal', mu: p.mu, sigma: p.sigma, shade: [
                            { from: p.mu - 4*p.sigma, to: p.x1, color: 'rgba(255, 75, 75, 0.4)' },
                            { from: p.x2, to: p.mu + 4*p.sigma, color: 'rgba(31, 119, 180, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 2,
                category: "Normal",
                title: "2. Dist. Normal - Consumo de memoria RAM Python",
                statement: "El consumo de memoria RAM (en GB) para un entorno virtual de Python sigue una distribución normal $X \\sim N(16, 2.25)$. Calcule la probabilidad de que un proceso aleatorio consuma entre 14 GB y 18 GB.",
                params: [
                    { id: "mu", label: "Media (μ)", min: 10, max: 25, step: 0.5, val: 16 },
                    { id: "variance", label: "Varianza (σ²)", min: 0.25, max: 10, step: 0.25, val: 2.25 },
                    { id: "xMin", label: "Límite Inferior", min: 10, max: 16, step: 0.5, val: 14 },
                    { id: "xMax", label: "Límite Superior", min: 16, max: 22, step: 0.5, val: 18 }
                ],
                solve: (p) => {
                    const sigma = Math.sqrt(p.variance);
                    const z1 = (p.xMin - p.mu) / sigma;
                    const z2 = (p.xMax - p.mu) / sigma;
                    const cdf1 = jStat.normal.cdf(p.xMin, p.mu, sigma);
                    const cdf2 = jStat.normal.cdf(p.xMax, p.mu, sigma);
                    const prob = cdf2 - cdf1;

                    return {
                        metrics: [
                            { label: "P(" + p.xMin + " < X < " + p.xMax + ")", value: (prob * 100).toFixed(2) + "%", delta: "Área Central" },
                            { label: "Desv. Est. (σ)", value: sigma.toFixed(4) + " GB" },
                            { label: "Z1 (x=" + p.xMin + ")", value: z1.toFixed(2) },
                            { label: "Z2 (x=" + p.xMax + ")", value: z2.toFixed(2) }
                        ],
                        math: `
                        <p>La varianza dada es $\\sigma^2 = ${p.variance}$, por lo que la desviación estándar es $\\sigma = \\sqrt{${p.variance}} = ${sigma.toFixed(4)}$ GB.</p>
                        <p>Estandarizamos los límites $X_1 = ${p.xMin}$ y $X_2 = ${p.xMax}$:</p>
                        $$Z_1 = \\frac{${p.xMin} - ${p.mu}}{${sigma.toFixed(4)}} = ${z1.toFixed(4)}$$
                        $$Z_2 = \\frac{${p.xMax} - ${p.mu}}{${sigma.toFixed(4)}} = ${z2.toFixed(4)}$$
                        <p>Calculamos la probabilidad del intervalo:</p>
                        $$P(${p.xMin} < X < ${p.xMax}) = P(${z1.toFixed(2)} < Z < ${z2.toFixed(2)}) = \\Phi(${z2.toFixed(2)}) - \\Phi(${z1.toFixed(2)})$$
                        $$= ${cdf2.toFixed(4)} - ${cdf1.toFixed(4)} = \\mathbf{${prob.toFixed(4)}} \\quad (${(prob*100).toFixed(2)}\\%)$$
                        `,
                        chart: { type: 'normal', mu: p.mu, sigma: sigma, shade: [
                            { from: p.xMin, to: p.xMax, color: 'rgba(255, 75, 75, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 3,
                category: "Normal",
                title: "3. Dist. Normal - Glucosa basal en Bioestadística",
                statement: "Mediciones de glucosa basal con distribución $N(105, 12^2)$ mg/dL. Se requiere aislar al 15% de la población con los niveles más altos (percentil 85). ¿Cuál es el nivel mínimo de glucosa necesario?",
                params: [
                    { id: "mu", label: "Media (μ)", min: 80, max: 130, step: 1, val: 105 },
                    { id: "sigma", label: "Desv. Est. (σ)", min: 5, max: 25, step: 1, val: 12 },
                    { id: "topPct", label: "Top Porcentaje (%)", min: 1, max: 50, step: 1, val: 15 }
                ],
                solve: (p) => {
                    const probLower = 1 - (p.topPct / 100);
                    const z = jStat.normal.inv(probLower, 0, 1);
                    const x = p.mu + z * p.sigma;

                    return {
                        metrics: [
                            { label: "Glucosa Mínima (x)", value: x.toFixed(2) + " mg/dL", delta: `P(X ≥ x) = ${p.topPct}%` },
                            { label: "Valor Z crítico", value: z.toFixed(4) },
                            { label: "Percentil", value: `${(probLower * 100).toFixed(0)}th` }
                        ],
                        math: `
                        <p>Buscamos el valor $x$ tal que $P(X > x) = ${p.topPct / 100}$, equivalente a acumulado $P(X \\le x) = ${probLower.toFixed(2)}$.</p>
                        <p>Utilizando el quantil de la distribución normal estándar $Z$:</p>
                        $$P(Z \\le z) = ${probLower.toFixed(2)} \\implies z = \\Phi^{-1}(${probLower.toFixed(2)}) = ${z.toFixed(4)}$$
                        <p>Despejando $x$ de la fórmula de estandarización $x = \\mu + z \\cdot \\sigma$:</p>
                        $$x = ${p.mu} + (${z.toFixed(4)} \\times ${p.sigma}) = \\mathbf{${x.toFixed(2)}\\text{ mg/dL}}$$
                        `,
                        chart: { type: 'normal', mu: p.mu, sigma: p.sigma, shade: [
                            { from: x, to: p.mu + 4*p.sigma, color: 'rgba(255, 75, 75, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 4,
                category: "Normal",
                title: "4. Dist. Normal - Timeout API Scopus / ScienceDirect",
                statement: "El tiempo de latencia de scraping se distribuye normalmente con $\\mu=210$ ms y $\\sigma=25$ ms. Configurar un timeout suficiente para que el 95% de las consultas completen exitosamente.",
                params: [
                    { id: "mu", label: "Media (μ)", min: 100, max: 400, step: 5, val: 210 },
                    { id: "sigma", label: "Desv. Est. (σ)", min: 5, max: 60, step: 1, val: 25 },
                    { id: "coverage", label: "% Cobertura Deseado", min: 80, max: 99.9, step: 0.5, val: 95 }
                ],
                solve: (p) => {
                    const prob = p.coverage / 100;
                    const z = jStat.normal.inv(prob, 0, 1);
                    const timeout = p.mu + z * p.sigma;

                    return {
                        metrics: [
                            { label: "Timeout Recomendado", value: timeout.toFixed(2) + " ms", delta: `${p.coverage}% de éxito` },
                            { label: "Z (p=" + prob + ")", value: z.toFixed(4) }
                        ],
                        math: `
                        <p>Queremos encontrar el tiempo umbral $t$ tal que la probabilidad de completar la solicitud en menor o igual tiempo sea $P(X \\le t) = ${prob}$.</p>
                        $$z = \\Phi^{-1}(${prob}) = ${z.toFixed(4)}$$
                        $$t = \\mu + z \\cdot \\sigma = ${p.mu} + (${z.toFixed(4)} \\times ${p.sigma}) = \\mathbf{${timeout.toFixed(2)}\\text{ ms}}$$
                        `,
                        chart: { type: 'normal', mu: p.mu, sigma: p.sigma, shade: [
                            { from: p.mu - 4*p.sigma, to: timeout, color: 'rgba(255, 75, 75, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 5,
                category: "Normal",
                title: "5. Dist. Normal - Simulaciones Montecarlo en Servidor",
                statement: "En un servidor se ejecutan $N=500$ simulaciones. El uso de CPU de cada una sigue $N(75\\%, 8\\%)$. ¿Cuántas simulaciones superarán el 90% de CPU activando la alerta?",
                params: [
                    { id: "N", label: "Num. Simulaciones (N)", min: 50, max: 2000, step: 50, val: 500 },
                    { id: "mu", label: "Media uso CPU (%)", min: 50, max: 90, step: 1, val: 75 },
                    { id: "sigma", label: "Desv. Est. (%)", min: 1, max: 20, step: 0.5, val: 8 },
                    { id: "threshold", label: "Umbral Alerta (%)", min: 70, max: 99, step: 1, val: 90 }
                ],
                solve: (p) => {
                    const z = (p.threshold - p.mu) / p.sigma;
                    const prob = 1 - jStat.normal.cdf(p.threshold, p.mu, p.sigma);
                    const expected = p.N * prob;

                    return {
                        metrics: [
                            { label: "Simulaciones Esperadas", value: expected.toFixed(2), delta: `~${Math.round(expected)} máquinas` },
                            { label: "Probabilidad P(X > " + p.threshold + "%)", value: (prob * 100).toFixed(3) + "%" },
                            { label: "Puntaje Z", value: z.toFixed(2) }
                        ],
                        math: `
                        <p>1. Calculamos primero la probabilidad de que una simulación individual supere el ${p.threshold}% de uso de CPU:</p>
                        $$Z = \\frac{${p.threshold} - ${p.mu}}{${p.sigma}} = ${z.toFixed(4)}$$
                        $$P(X > ${p.threshold}) = 1 - \\Phi(${z.toFixed(4)}) = 1 - ${jStat.normal.cdf(p.threshold, p.mu, p.sigma).toFixed(5)} = \\mathbf{${prob.toFixed(5)}}$$
                        <p>2. Multiplicamos por el total de simulaciones independientes $N = ${p.N}$:</p>
                        $$E(\\text{Alertas}) = N \\times P(X > ${p.threshold}) = ${p.N} \\times ${prob.toFixed(5)} = \\mathbf{${expected.toFixed(2)} \\approx ${Math.round(expected)}\\text{ simulaciones}}$$
                        `,
                        chart: { type: 'normal', mu: p.mu, sigma: p.sigma, shade: [
                            { from: p.threshold, to: p.mu + 4*p.sigma, color: 'rgba(255, 75, 75, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 6,
                category: "Exponencial",
                title: "6. Dist. Exponencial - Latencia API Scopus",
                statement: "El tiempo de respuesta $X$ en segundos sigue una distribución exponencial con tasa $\\lambda=0.25$ consultas/seg. a) $P(X > 6)$. b) $P(2 < X < 5)$.",
                params: [
                    { id: "lambda", label: "Tasa (λ)", min: 0.05, max: 1.0, step: 0.05, val: 0.25 },
                    { id: "xA", label: "Umbral Parte a (X > x)", min: 1, max: 15, step: 1, val: 6 },
                    { id: "xB1", label: "Parte b Límite Inf", min: 0.5, max: 5, step: 0.5, val: 2 },
                    { id: "xB2", label: "Parte b Límite Sup", min: 3, max: 10, step: 0.5, val: 5 }
                ],
                solve: (p) => {
                    const probA = Math.exp(-p.lambda * p.xA);
                    const probB = Math.exp(-p.lambda * p.xB1) - Math.exp(-p.lambda * p.xB2);

                    return {
                        metrics: [
                            { label: "P(X > " + p.xA + ")", value: (probA * 100).toFixed(2) + "%" },
                            { label: "P(" + p.xB1 + " < X < " + p.xB2 + ")", value: (probB * 100).toFixed(2) + "%" },
                            { label: "Tiempo Medio (1/λ)", value: (1 / p.lambda).toFixed(2) + " s" }
                        ],
                        math: `
                        <p>Función de densidad de probabilidad acumulada $F(x) = 1 - e^{-\\lambda x}$ y supervivencia $P(X > x) = e^{-\\lambda x}$.</p>
                        <p><b>Parte a)</b> $P(X > ${p.xA})$:</p>
                        $$P(X > ${p.xA}) = e^{-${p.lambda} \\times ${p.xA}} = e^{-${(p.lambda*p.xA).toFixed(2)}} = \\mathbf{${probA.toFixed(4)}} \\quad (${(probA*100).toFixed(2)}\\%)$$
                        <p><b>Parte b)</b> $P(${p.xB1} < X < ${p.xB2})$:</p>
                        $$P(${p.xB1} < X < ${p.xB2}) = e^{-\\lambda(${p.xB1})} - e^{-\\lambda(${p.xB2})} = e^{-${(p.lambda*p.xB1).toFixed(2)}} - e^{-${(p.lambda*p.xB2).toFixed(2)}}$$
                        $$= ${Math.exp(-p.lambda*p.xB1).toFixed(4)} - ${Math.exp(-p.lambda*p.xB2).toFixed(4)} = \\mathbf{${probB.toFixed(4)}} \\quad (${(probB*100).toFixed(2)}\\%)$$
                        `,
                        chart: { type: 'exponential', lambda: p.lambda, max: 15, shade: [
                            { from: p.xA, to: 15, color: 'rgba(255, 75, 75, 0.4)' },
                            { from: p.xB1, to: p.xB2, color: 'rgba(31, 119, 180, 0.4)' }
                        ]}
                    };
                }
            },
            {
                id: 7,
                category: "Exponencial",
                title: "7. Dist. Exponencial - Tiempo RStudio en Genómica",
                statement: "El tiempo para un análisis de correspondencia múltiple en RStudio sigue una distribución exponencial con tiempo promedio de 8 minutos $(\\lambda = 1/8)$. a) Tiempo mediano. b) Tiempo máximo para que el 85% termine.",
                params: [
                    { id: "mean", label: "Tiempo Promedio (min)", min: 1, max: 30, step: 1, val: 8 },
                    { id: "pctB", label: "Porcentaje Completado (%)", min: 50, max: 99, step: 1, val: 85 }
                ],
                solve: (p) => {
                    const lambda = 1 / p.mean;
                    const median = Math.LN2 / lambda;
                    const pFrac = p.pctB / 100;
                    const tLimit = -Math.log(1 - pFrac) / lambda;

                    return {
                        metrics: [
                            { label: "Mediana (50%)", value: median.toFixed(2) + " min" },
                            { label: `Límite ${p.pctB}% Eval.`, value: tLimit.toFixed(2) + " min" },
                            { label: "Tasa λ", value: lambda.toFixed(4) }
                        ],
                        math: `
                        <p>Dado que el tiempo medio es $E(X) = ${p.mean}$ min, la tasa es $\\lambda = 1/${p.mean} = ${lambda.toFixed(4)}$ min$^{-1}$.</p>
                        <p><b>Parte a) Mediana ($x_{0.50}$):</b> Es el valor donde $F(x) = 0.50$:</p>

        // --- GLOBAL APP STATE ---
        let currentExercise = exercises[0];

        // --- STREAMING_CHUNK: App Initialization and UI Event Listeners ---
        window.onload = function() {
            populateExerciseDropdown();
            loadExercise();
        };

        function populateExerciseDropdown() {
            const select = document.getElementById("exerciseSelect");
            const filter = document.getElementById("topicFilter").value;
            select.innerHTML = "";

            exercises.forEach(ex => {
                if (filter === "ALL" || ex.category === filter) {
                    const opt = document.createElement("option");
                    opt.value = ex.id;
                    opt.textContent = ex.title;
                    select.appendChild(opt);
                }
            });
        }

        function filterExercises() {
            populateExerciseDropdown();
            const select = document.getElementById("exerciseSelect");
            if (select.options.length > 0) {
                select.selectedIndex = 0;
                loadExercise();
            }
        }

        function loadExercise() {
            const id = parseInt(document.getElementById("exerciseSelect").value);
            currentExercise = exercises.find(e => e.id === id);

            // Set Header Information
            document.getElementById("exerciseCategory").innerHTML = `<i class="fa-solid fa-tag"></i> TEMA: ${currentExercise.category}`;
            document.getElementById("exerciseTitle").textContent = currentExercise.title;
            document.getElementById("exerciseStatement").innerHTML = currentExercise.statement;

            // Render Dynamic Parameter Input Widgets
            renderWidgets();

            // Perform Calculations and Update UI
            updateCalculations();
        }

        function renderWidgets() {
            const container = document.getElementById("dynamicWidgets");
            container.innerHTML = `<h3 class="text-xs font-semibold text-stGray uppercase tracking-wider mb-2">Parámetros de Entrada</h3>`;

            currentExercise.params.forEach(param => {
                const wrapper = document.createElement("div");
                wrapper.className = "bg-white p-3 rounded-lg border border-gray-200 shadow-sm";

                wrapper.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-stText">${param.label}</label>
                        <span id="val_${param.id}" class="text-xs font-bold text-stRed bg-red-50 px-2 py-0.5 rounded">${param.val}</span>
                    </div>
                    <input type="range" id="input_${param.id}" min="${param.min}" max="${param.max}" step="${param.step}" value="${param.val}"
                        oninput="onParamChange('${param.id}')" class="w-full accent-stRed h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                `;
                container.appendChild(wrapper);
            });
        }

        function onParamChange(paramId) {
            const val = parseFloat(document.getElementById(`input_${paramId}`).value);
            document.getElementById(`val_${paramId}`).textContent = val;
            updateCalculations();
        }

        function updateCalculations() {
            // Read param values
            const paramVals = {};
            currentExercise.params.forEach(p => {
                const el = document.getElementById(`input_${p.id}`);
                paramVals[p.id] = el ? parseFloat(el.value) : p.val;
            });

            // Run Solver Logic
            const result = currentExercise.solve(paramVals);

            // Render Metrics Cards
            renderMetrics(result.metrics);

            // Render Math Solution and Statement with MathJax
            const mathContainer = document.getElementById("mathSolution");
            const statementContainer = document.getElementById("exerciseStatement");

            mathContainer.innerHTML = result.math;

            if (window.MathJax) {
                // Limpia la memoria de renderizado previo
                if (window.MathJax.typesetClear) {
                    window.MathJax.typesetClear();
                }
                // Procesa tanto el enunciado como la solución paso a paso
                window.MathJax.typesetPromise([statementContainer, mathContainer]).catch((err) => console.log(err));
            }

            // Render Plotly Visual Distribution
            renderChart(result.chart);
        }

        function renderMetrics(metrics) {
            const container = document.getElementById("metricsContainer");
            container.innerHTML = "";

            metrics.forEach(m => {
                const card = document.createElement("div");
                card.className = "st-metric flex flex-col justify-between";

                card.innerHTML = `
                    <span class="text-xs font-semibold text-stGray uppercase tracking-wider">${m.label}</span>
                    <div class="text-2xl font-extrabold text-stText mt-1 mb-1">${m.value}</div>
                    ${m.delta ? `<span class="text-xs font-semibold text-stRed"><i class="fa-solid fa-arrow-trend-up mr-1"></i>${m.delta}</span>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // --- STREAMING_CHUNK: Rendering Plotly Interactive Charts ---
        function renderChart(config) {
            let xVals = [];
            let yVals = [];
            let traces = [];

            if (config.type === 'normal') {
                const min = config.mu - 4 * config.sigma;
                const max = config.mu + 4 * config.sigma;
                const step = (max - min) / 200;

                for (let x = min; x <= max; x += step) {
                    xVals.push(x);
                    yVals.push(jStat.normal.pdf(x, config.mu, config.sigma));
                }

                // Base PDF Line
                traces.push({
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: 'PDF Normal',
                    line: { color: '#31333F', width: 2.5 }
                });

                // Add Shaded Areas
                if (config.shade) {
                    config.shade.forEach(s => {
                        let sx = [], sy = [];
                        for (let x = s.from; x <= s.to; x += step) {
                            sx.push(x);
                            sy.push(jStat.normal.pdf(x, config.mu, config.sigma));
                        }
                        traces.push({
                            x: [s.from, ...sx, s.to],
                            y: [0, ...sy, 0],
                            fill: 'tozeroy',
                            mode: 'none',
                            fillcolor: s.color || 'rgba(255, 75, 75, 0.4)',
                            name: 'Área Sombreada'
                        });
                    });
                }
            } 
            else if (config.type === 'exponential') {
                const max = config.max || 15;
                const step = max / 200;

                for (let x = 0; x <= max; x += step) {
                    xVals.push(x);
                    yVals.push(jStat.exponential.pdf(x, config.lambda));
                }

                traces.push({
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: 'PDF Exponencial',
                    line: { color: '#31333F', width: 2.5 }
                });

                if (config.shade) {
                    config.shade.forEach(s => {
                        let sx = [], sy = [];
                        for (let x = Math.max(0, s.from); x <= Math.min(max, s.to); x += step) {
                            sx.push(x);
                            sy.push(jStat.exponential.pdf(x, config.lambda));
                        }
                        traces.push({
                            x: [Math.max(0, s.from), ...sx, Math.min(max, s.to)],
                            y: [0, ...sy, 0],
                            fill: 'tozeroy',
                            mode: 'none',
                            fillcolor: s.color || 'rgba(255, 75, 75, 0.4)',
                            name: 'Área Sombreada'
                        });
                    });
                }
            } 
            else if (config.type === 'gamma') {
                const max = config.max || 20;
                const step = max / 200;

                for (let x = 0.01; x <= max; x += step) {
                    xVals.push(x);
                    yVals.push(jStat.gamma.pdf(x, config.shape, config.scale));
                }

                traces.push({
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: 'PDF Gamma',
                    line: { color: '#31333F', width: 2.5 }
                });

                if (config.shade) {
                    config.shade.forEach(s => {
                        let sx = [], sy = [];
                        for (let x = Math.max(0.01, s.from); x <= Math.min(max, s.to); x += step) {
                            sx.push(x);
                            sy.push(jStat.gamma.pdf(x, config.shape, config.scale));
                        }
                        traces.push({
                            x: [Math.max(0.01, s.from), ...sx, Math.min(max, s.to)],
                            y: [0, ...sy, 0],
                            fill: 'tozeroy',
                            mode: 'none',
                            fillcolor: s.color || 'rgba(255, 75, 75, 0.4)',
                            name: 'Área Sombreada'
                        });
                    });
                }
            } 
            else if (config.type === 'chisquare') {
                const max = config.max || 30;
                const step = max / 200;

                for (let x = 0.05; x <= max; x += step) {
                    xVals.push(x);
                    yVals.push(jStat.chisquare.pdf(x, config.df));
                }

                traces.push({
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: `Chi2 (df=${config.df})`,
                    line: { color: '#31333F', width: 2.5 }
                });

                if (config.shade) {
                    config.shade.forEach(s => {
                        let sx = [], sy = [];
                        for (let x = Math.max(0.05, s.from); x <= Math.min(max, s.to); x += step) {
                            sx.push(x);
                            sy.push(jStat.chisquare.pdf(x, config.df));
                        }
                        traces.push({
                            x: [Math.max(0.05, s.from), ...sx, Math.min(max, s.to)],
                            y: [0, ...sy, 0],
                            fill: 'tozeroy',
                            mode: 'none',
                            fillcolor: s.color || 'rgba(255, 75, 75, 0.4)',
                            name: 'Área Sombreada'
                        });
                    });
                }
            } 
            else if (config.type === 'tstudent') {
                const min = -4.5;
                const max = 4.5;
                const step = (max - min) / 200;

                for (let x = min; x <= max; x += step) {
                    xVals.push(x);
                    yVals.push(jStat.studentt.pdf(x, config.df));
                }

                traces.push({
                    x: xVals,
                    y: yVals,
                    mode: 'lines',
                    name: `t-Student (df=${config.df})`,
                    line: { color: '#31333F', width: 2.5 }
                });

                if (config.shade) {
                    config.shade.forEach(s => {
                        let sx = [], sy = [];
                        for (let x = Math.max(min, s.from); x <= Math.min(max, s.to); x += step) {
                            sx.push(x);
                            sy.push(jStat.studentt.pdf(x, config.df));
                        }
                        traces.push({
                            x: [Math.max(min, s.from), ...sx, Math.min(max, s.to)],
                            y: [0, ...sy, 0],
                            fill: 'tozeroy',
                            mode: 'none',
                            fillcolor: s.color || 'rgba(255, 75, 75, 0.4)',
                            name: 'Área Sombreada'
                        });
                    });
                }
            }

            const layout = {
                margin: { t: 10, b: 40, l: 40, r: 20 },
                showlegend: false,
                xaxis: { title: 'Variable (X)', gridcolor: '#F0F2F6' },
                yaxis: { title: 'Densidad (f(x))', gridcolor: '#F0F2F6' },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            };

            Plotly.newPlot('plotlyChart', traces, layout, { responsive: true, displayModeBar: false });
        }
    </script>
</body>
